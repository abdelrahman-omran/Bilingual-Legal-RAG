name: Legal RAG CI/CD Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

env:
  CUDA_VISIBLE_DEVICES: ""  # Forces PyTorch/transformers to run strictly on CPU
  QDRANT_URL: "http://localhost:6333" # Forces QdrantClient to use HTTP server in CI
  # Dummy keys so Langfuse decorators don't block/fail during CI test runs
  LANGFUSE_PUBLIC_KEY: "pk-lf-ci-dummy"
  LANGFUSE_SECRET_KEY: "sk-lf-ci-dummy"
  LANGFUSE_HOST: "http://localhost:3001"

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    # Spin up an isolated Qdrant container for the job
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Cache uv & Hugging Face models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/huggingface
            .dvc/cache
          key: ${{ runner.os }}-rag-cache-${{ hashFiles('uv.lock', 'dvc.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-rag-cache-

      - name: Install local package and dependencies
        run: |
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -e ".[dev]"
          uv pip install --system dvc

      - name: 1. Lint Code
        run: ruff check src/ tests/ scripts/

      - name: 2. Run Unit Tests
        run: pytest tests/ -v

      - name: 3. Restore/Rebuild Vector Index
        run: |
          dvc checkout || true
          # Run dvc repro to populate the Qdrant service container on port 6333
          echo "Building index with dvc repro into Qdrant service..."
          dvc repro

      - name: 4. Run Quality Gate Benchmark
        run: python scripts/eval_ci.py

      - name: 5. Build Docker Image
        run: docker build -t bilingual-legal-rag:latest .

  publish-docker:
    name: Push Docker Image to GHCR
    needs: ci-pipeline
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}