name: Legal RAG CI/CD Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

env:
  CUDA_VISIBLE_DEVICES: ""  # Forces PyTorch/transformers to run strictly on CPU

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache uv, Hugging Face models, & DVC
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/huggingface
            .dvc/cache
          key: ${{ runner.os }}-ci-${{ hashFiles('uv.lock', 'dvc.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-

      - name: Install local package and dependencies
        run: |
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -e ".[dev]"
          uv pip install --system dvc

      - name: 1. Lint Code
        run: ruff check src/ tests/ scripts/

      - name: 2. Run Unit Tests
        run: pytest tests/ -v

      - name: 3. Restore/Rebuild Index (DVC Pipeline)
        run: |
          dvc checkout || true
          # If data/qdrant_db wasn't restored from DVC cache, reproduce the index stage
          if [ ! -d "data/qdrant_db" ]; then
            echo "qdrant_db not found in workspace/cache. Running dvc repro..."
            dvc repro
          fi

      - name: 4. Run Quality Gate Benchmark
        run: python scripts/eval_ci.py

      - name: 5. Build Docker Image
        run: docker build -t bilingual-legal-rag:latest .

  publish-docker:
    name: Push Docker Image to GHCR
    needs: ci-pipeline
    # Only run on pushes (merges) to main/master, not on pull requests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}