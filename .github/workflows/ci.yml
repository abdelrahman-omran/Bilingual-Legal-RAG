name: Legal RAG CI Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

env:
  CUDA_VISIBLE_DEVICES: ""  # Forces PyTorch/transformers to run strictly on CPU

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache uv, Hugging Face models, & DVC
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/huggingface
            .dvc/cache
          key: ${{ runner.os }}-ci-${{ hashFiles('uv.lock', 'dvc.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-

      - name: Install local package and dependencies
        run: |
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -e ".[dev]"
          uv pip install --system dvc

      - name: 1. Lint Code
        run: ruff check src/ tests/ scripts/

      - name: 2. Run Unit Tests
        run: pytest tests/ -v

      - name: 3. Rebuild Index (DVC Pipeline)
        run: |
          dvc checkout || true
          # Only run full repro if data/raw or dvc.yaml was modified in this commit/PR
          if git diff --name-only HEAD~1 HEAD | grep -E '^(data/raw/|dvc.yaml|params.yaml)'; then
            echo "Data or pipeline config changed. Running dvc repro..."
            dvc repro
          else
            echo "No pipeline inputs changed. Skipping dvc repro."
          fi

      - name: 4. Run Quality Gate Benchmark
        run: python scripts/eval_ci.py

      - name: 5. Build Docker Image
        run: docker build -t bilingual-legal-rag:latest .