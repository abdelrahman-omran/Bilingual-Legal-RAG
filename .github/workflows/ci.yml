name: Legal RAG CI/CD Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

env:
  CUDA_VISIBLE_DEVICES: ""  # Forces PyTorch/transformers to run strictly on CPU
  QDRANT_URL: "http://localhost:6333" # Forces QdrantClient to use HTTP server in CI
  LANGFUSE_PUBLIC_KEY: "pk-lf-ci-dummy"
  LANGFUSE_SECRET_KEY: "sk-lf-ci-dummy"
  LANGFUSE_HOST: "http://localhost:3001"

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          uv pip install --system --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"

      - name: Lint Code (Ruff)
        run: ruff check src/ tests/ scripts/

      - name: Run Unit Tests (Pytest)
        run: pytest tests/ -v

  data-pipeline:
    name: DVC Pipeline & Vector Indexing
    needs: lint-and-test
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Cache DVC & Vector Index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/huggingface
            .dvc/cache
            data/processed
            data/qdrant_db
          key: ${{ runner.os }}-dvc-index-${{ hashFiles('dvc.lock', 'scripts/build_index.py', 'scripts/extract_corpus.py') }}
          restore-keys: |
            ${{ runner.os }}-dvc-index-

      - name: Install dependencies
        run: |
          uv pip install --system --extra-index-url https://download.pytorch.org/whl/cpu -e ".[eval]"
          uv pip install --system dvc

      - name: Run DVC Reproduction
        run: |
          dvc checkout || true
          dvc repro

  benchmark:
    name: Quality Gate Benchmark
    needs: data-pipeline
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Restore Cached Data & Index
        uses: actions/cache@v4
        with:
          path: |
            data/processed
            data/qdrant_db
          key: ${{ runner.os }}-dvc-index-${{ hashFiles('dvc.lock', 'scripts/build_index.py', 'scripts/extract_corpus.py') }}

      - name: Install dependencies
        run: |
          uv pip install --system --extra-index-url https://download.pytorch.org/whl/cpu -e ".[eval]"

      - name: Run Quality Gate Benchmark
        run: python scripts/eval_ci.py

  build-docker:
    name: Build Docker Image
    needs: [lint-and-test, benchmark]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: bilingual-legal-rag:latest

  publish-docker:
    name: Push Docker Image to GHCR
    needs: build-docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}