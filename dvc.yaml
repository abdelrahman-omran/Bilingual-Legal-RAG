stages:
  extract:
    cmd: python scripts/extract_corpus.py --pdf data/raw/egyptian_civil_code.pdf --out data/processed/corpus.json
    deps:
      - data/raw/egyptian_civil_code.pdf
      - src/legal_rag/extraction/pdf_reader.py
      - scripts/extract_corpus.py
    outs:
      - data/processed/corpus.json

  index:
    cmd: python scripts/build_index.py --input data/processed/corpus.json --db-path data/qdrant_db
    deps:
      - data/processed/corpus.json
      - src/legal_rag/ingestion/indexer.py
      - scripts/build_index.py
    outs:
      - data/qdrant_db