[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bilingual-legal-rag"
version = "0.1.0"
description = "Bilingual Egyptian Civil Code RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dvc>=3.0.0",
    "pdfplumber>=0.10.0",
    "pyarabic>=0.6.0",
    "pydantic-settings>=2.0.0",
    # Ingestion & Vector DB
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.5.0",
    "transformers>=4.38.0",
    "datasets<3.0.0",   # Fixes sentence-transformers IterableDataset ImportError
    "pyarrow<20.0.0",  # Fixes PyExtensionType AttributeError
    # Serving & API
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    # Experiment Tracking & Benchmarking
    "mlflow>=2.10.0",
    "prometheus-client>=0.20",
    "ragas>=0.2.0",      # Bumps to v0.2+ to fix legacy import errors
    "langfuse>=2.60,<3",
    # LLM serving (OpenAI-compatible client for llama.cpp server)
    "openai>=1.30.0",
    "huggingface_hub>=0.24.0",
    "bentoml>=1.4.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.9",
    "locust>=2.31.0",
]
eval = [
    "langchain-openai>=0.2",
    "langchain-huggingface>=0.1",
    "langchain-community<0.4.2",
    "datasets>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag"]
