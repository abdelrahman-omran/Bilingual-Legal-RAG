[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bilingual-legal-rag"
version = "0.1.0"
description = "Bilingual Egyptian Civil Code RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dvc>=3.0.0",
    "pdfplumber>=0.10.0",
    "pyarabic>=0.6.0",
    "pydantic-settings>=2.0.0",
    # Ingestion & Vector DB
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.5.0",
    "pyarrow<20.0.0",  # Fixes PyExtensionType AttributeError in datasets/sentence-transformers
    # Serving & API
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    # Experiment Tracking & Benchmarking
    "mlflow>=2.10.0",
    "ragas>=0.1.0",
    "langfuse>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag"]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
