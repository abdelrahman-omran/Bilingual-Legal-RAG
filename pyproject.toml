[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bilingual-legal-rag"
version = "0.1.0"
description = "Bilingual Egyptian Civil Code RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dvc>=3.0.0",
    "pdfplumber>=0.10.0",
    "pyarabic>=0.6.0",
    "pydantic-settings>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag"]