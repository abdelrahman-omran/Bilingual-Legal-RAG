global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]          # Qdrant exposes /metrics natively

  - job_name: llama
    static_configs:
      - targets: ["llm:8080"]             # llama-server with --metrics

  - job_name: bentoml
    static_configs:
      - targets: ["host.docker.internal:3000"]   # canary profile; use host.docker.internal:3000
                                          # when running `bentoml serve` on the host

  - job_name: faithfulness
    static_configs:
      - targets: ["exporter:9100"]
  
  - job_name: "legal-rag"
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-api:3000"]