service: "legal_rag.serving.bentoml_service:LegalRAGService"
name: legal_rag_service
labels:
  project: bilingual-legal-rag
include:
  - "src/**"
  - "dist/**"
python:
  # uv cannot satisfy qdrant-client's urllib3 pin when the pytorch index is
  # listed as extra_index_url under its default first-match strategy.
  # Fix A: build with UV_INDEX_STRATEGY=unsafe-best-match (locking stays on).
  # Fix B (this line): let pip resolve at install time instead.
  lock_packages: false
  extra_index_url: "https://download.pytorch.org/whl/cpu"
  packages:
    - "./dist/bilingual_legal_rag-0.1.0-py3-none-any.whl"
    - "torch"
    - "sentence-transformers>=2.5.0"
    - "qdrant-client>=1.7.0"
    - "openai>=1.30.0"
    - "pydantic>=2.0.0"