services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal_rag_api
    ports:
      - "8000:8000"
    environment:
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-Qwen/Qwen2.5-1.5B-Instruct}
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    restart: unless-stopped