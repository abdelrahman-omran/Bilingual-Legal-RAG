services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: legal_rag_llm
    command: >
      -m /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
      --host 0.0.0.0 --port 8080 -c 4096 -t 4 --metrics
    volumes:
      - ./models:/models:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal_rag_qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant_server:/qdrant/storage
    restart: unless-stopped

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal_rag_api
    depends_on:
      - llm
      - qdrant
    ports:
      - "8000:8000"
    environment:
      - LLM_BACKEND=llamacpp
      - LLM_BASE_URL=http://llm:8080/v1
      - LLM_MODEL_NAME=Qwen/Qwen2.5-1.5B-Instruct
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    restart: unless-stopped
# docker-compose.yaml additions
  langfuse-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      - langfuse-db
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: dev-secret-change-me
      SALT: dev-salt-change-me

  prometheus:
    image: prom/prometheus:latest
    container_name: legal_rag_prometheus
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: legal_rag_alertmanager
    ports: ["9093:9093"]
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  exporter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal_rag_exporter
    command: python scripts/faithfulness_exporter.py
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
    volumes:
      - ./mlflow.db:/app/mlflow.db:ro
  grafana:
    image: grafana/grafana:latest
    container_name: legal_rag_grafana
    ports: ["3002:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  langfuse_pg:
  grafana_data:
