services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal_rag_api
    ports:
      - "8000:8000"
    environment:
      - VLLM_BASE_URL=http://host.docker.internal:8003/v1
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3